<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>to zxy 🎄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,600&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<!-- 国内网络打不开 Google Fonts 时的镜像（同一套字体，加载失败也不影响） -->
<link href="https://fonts.loli.net/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,600&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .veil{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(circle at 50% 52%, rgba(0,0,0,0) 36%, rgba(0,0,0,.26) 72%, rgba(0,0,0,.55) 100%)}
  .txt{position:fixed;left:7vw;top:30%;pointer-events:none;
       font-family:"Cormorant Garamond","Playfair Display","Didot","Times New Roman",Georgia,serif;
       filter:drop-shadow(0 0 16px rgba(255,214,102,.42)) drop-shadow(0 0 46px rgba(255,196,70,.20))}
  .txt h1{margin:0;font-weight:400;font-style:italic;
          font-size:clamp(58px,7.4vw,118px);line-height:1.16;letter-spacing:.005em;
          /* padding 必须有：金色渐变只画在背景框内，斜体 y 的尾巴超出框就会被裁成 v */
          padding:.06em .06em .30em;
          color:#f4d06a;                                     /* 不支持渐变字时的兜底色 */
          background:linear-gradient(178deg,#fffdf2 0%,#fff6d2 28%,#f7d878 56%,#e0b64a 80%,#c99a33 100%);
          -webkit-background-clip:text;background-clip:text;
          -webkit-text-fill-color:transparent}
  .txt h1 i{font-style:italic;font-weight:300;font-size:.44em;letter-spacing:.06em;
            opacity:.92;margin-right:.1em;vertical-align:.16em}
  .txt p{margin:.7em 0 0;font-family:"Cinzel",Georgia,serif;font-size:clamp(11px,1.16vw,17px);
         letter-spacing:.44em;color:#cfe9d8;opacity:.72;text-shadow:0 0 18px rgba(70,255,140,.22)}
  .hint{position:fixed;left:7vw;bottom:7vh;pointer-events:none;color:#eaffd8;opacity:0;
        font:400 13px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;
        animation:hint 7s ease-in-out forwards}
  @keyframes hint{10%{opacity:.42}70%{opacity:.42}100%{opacity:0}}
  @media (max-width:560px){.txt{top:23%}.hint{bottom:5vh}}

  /* 手势控制面板 */
  .ui{position:fixed;left:0;right:0;bottom:0;padding:0 7vw 20px;display:flex;align-items:center;
      gap:16px;flex-wrap:wrap;transition:opacity .45s ease;z-index:5}
  .ui-hidden{opacity:0;pointer-events:none}
  .btn{background:rgba(255,255,255,.055);border:1px solid rgba(212,175,55,.5);color:#fceea7;
       padding:10px 20px;border-radius:999px;font:500 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
       letter-spacing:.16em;cursor:pointer;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
       transition:background .25s,border-color .25s,color .25s}
  .btn:hover{background:rgba(212,175,55,.16);border-color:#d4af37}
  .btn:active{transform:translateY(1px)}
  .stat{color:#a8c0ae;font:400 11px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.1em}
  .keys{color:#68796d;font:400 11px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.08em}
  .keys b{color:#c9b06a;font-weight:500}
  #camwrap{position:fixed;right:0;bottom:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
  #cam{width:160px;height:120px}
  @media (max-width:560px){.ui{padding:0 6vw 16px;gap:10px}.keys{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="veil"></div>
<div class="txt"><h1><i>to</i> zxy</h1><p>MERRY CHRISTMAS</p></div>
<div class="hint">拖动旋转 · 双击撒花</div>
<div class="ui" id="ui">
  <button class="btn" id="camBtn">启用摄像头手势</button>
  <div class="stat" id="stat">手势：未启用</div>
  <div class="keys"><b>握拳</b> 圣诞树 · <b>张开</b> 散落 · <b>捏合</b> 聚焦 · 手左右上下转会带着树转 · 也可按 <b>1 2 3</b> · <b>H</b> 隐藏控件</div>
</div>
<div id="camwrap"><video id="cam" playsinline muted></video><canvas id="mcv" width="160" height="120"></canvas></div>
<script>
(function () {
'use strict';
var TAU = Math.PI * 2;
// 相机参数，与 tree.py 一致
var TREE_H = 12.0, PITCH = -0.25, CAM_DIST = 13.0, CAM_HEIGHT = 6.0;

var cvs = document.getElementById('c');
var ctx = cvs.getContext('2d', { alpha: false });
var W = 0, H = 0, img = null, buf = null;

var small = Math.min(screen.width, screen.height) < 700;
var TREE_N   = small ? 29000 : 58000;
var GROUND_N = small ? 2600  : 5000;
var STAR_N   = small ? 900   : 1700;
var HEART_N  = small ? 800   : 1500;
var WING_N   = small ? 6400  : 14000;
var EMB_N    = small ? 44    : 92;
var SNOW_N   = small ? 13    : 24;
var SPK_N    = small ? 8     : 15;

var xs, ys, zs, cr, cg, cb, ph, twk, fac, gl, N;
var wingStart = 0, wingEnd = 0;    // 光帘不跟随旋转，始终在树左右两侧
var heartStart = 0, heartEnd = 0;  // 树顶爱心始终面向镜头
var TW_A = new Float32Array(256), TW_B = new Float32Array(256);
var spkX = new Float32Array(SPK_N), spkY = new Float32Array(SPK_N), spkZ = new Float32Array(SPK_N),
    spkP = new Float32Array(SPK_N), spkV = new Float32Array(SPK_N);
// 绕爱心的光点
var ORB_N = small ? 9 : 16;
var orbA = new Float32Array(ORB_N), orbS = new Float32Array(ORB_N),
    orbR = new Float32Array(ORB_N), orbP = new Float32Array(ORB_N);

// ── 手势状态机（MediaPipe Hands）──────────────────────────────
var GS = {
  ready: false,        // 模型 + 摄像头是否就绪
  active: false,       // 当前是否看见手
  lastSeen: -99,       // 上次看见手的时间
  mode: 'TREE',        // TREE | SCATTER | FOCUS
  gesture: 'none',
  tx: 0.5, ty: 0.5,    // 手掌中心（Landmark 9）的归一化坐标
  base: 0, baseSet: false
};
var morph = 0;         // 0 = 圣诞树，1 = 散落
var focus = 0;         // 聚焦推近系数
var pitchExtra = 0;
var TX = null, TY = null, TZ = null;   // 散落形态的目标位置

function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function clamp255(v) { return v < 0 ? 0 : (v > 255 ? 255 : v); }
function gauss(mu, sd) {
  var u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}

function build() {
  var X = [], Y = [], Z = [], R = [], G = [], B = [], P = [], K = [], F = [], L = [];
  var glowLeft = small ? 700 : 1800;
  var i, u, h, y, baseR, wave, t, ang, r, gm, gt;
  // 树顶金色化程度：0.34 以下是纯绿，往上快速变成金黄色
  function goldMix(hh) {
    var k = (hh - 0.34) / 0.34;
    if (k < 0) k = 0; else if (k > 1) k = 1;
    k = k * k * (3 - 2 * k);             // 平滑过渡
    return Math.pow(k, 0.62);            // 提前转金，让树顶整段都是金黄色
  }

  function add(x, y, z, rr, gg, bb, f, wantGlow) {
    X.push(x); Y.push(y); Z.push(z);
    R.push(clamp255(rr | 0)); G.push(clamp255(gg | 0)); B.push(clamp255(bb | 0));
    P.push(randInt(0, 255));
    K.push(Math.random() < 0.5 ? 0 : 1);
    F.push(f === undefined ? 100 : f);
    if (wantGlow && glowLeft > 0) { L.push(1); glowLeft--; } else L.push(0);
  }

  // 螺旋灯带：双股，翠绿底 + 金色灯泡
  var spiral = Math.floor(TREE_N * 0.62);
  for (i = 0; i < spiral; i++) {
    u = Math.random();
    h = Math.pow(u, 1.55);
    y = TREE_H * h + 0.2;
    baseR = Math.pow(1 - h, 1.1) * 3.1;
    wave = Math.max(0, Math.sin((h * 6.2 + 0.15) * TAU));
    baseR *= 1 + 0.70 * wave;
    t = u * 10 * TAU;
    ang = t + ((i & 1) ? Math.PI : 0) + rand(-0.16, 0.16);
    r = baseR * rand(0.86, 1.07);
    var sx0 = Math.cos(ang) * r, sz0 = Math.sin(ang) * r;
    gt = goldMix(h);
    if (Math.random() < 0.15 + 0.55 * gt) {          // 越靠近树顶，金色灯泡越多
      add(sx0, y, sz0, 255, randInt(198, 238), randInt(64, 116), randInt(124, 156), true);
    } else {
      gm = Math.min(255, 176 + Math.floor(66 * (1 - Math.abs(h - 0.55) * 1.3)));
      // 绿 → 金 渐变（顶部为金色/黄色）
      add(sx0, y, sz0,
          clamp255((randInt(18, 78) * (1 - gt)) + 255 * gt),
          clamp255(gm * (1 - gt) + 206 * gt),
          clamp255((randInt(48, 112) * (1 - gt)) + 62 * gt),
          randInt(95, 128), gt > 0.32);
    }
  }

  // 随机填充：内部压深，外缘带金
  for (i = 0; i < TREE_N - spiral; i++) {
    h = Math.pow(Math.random(), 1.95);
    y = TREE_H * h + 0.2 + rand(-0.1, 0.1);
    baseR = Math.pow(1 - h, 1.1) * 3.75;
    wave = Math.max(0, Math.sin((h * 6.2 + 0.15) * TAU));
    baseR *= 1 + 0.56 * wave;
    r = baseR * Math.sqrt(Math.random());
    ang = Math.random() * TAU;
    var depth = r / (baseR < 0.01 ? 0.01 : baseR);
    gt = goldMix(h);
    if (Math.random() < 0.05 + 0.5 * gt || (depth > 0.84 && Math.random() < 0.30)) {
      add(Math.cos(ang) * r, y, Math.sin(ang) * r, 255, randInt(204, 242), randInt(68, 132), 108, Math.random() < 0.2);
    } else {
      var fr = randInt(3, 40), fg = clamp255(Math.floor(92 + 130 * depth)), fb = clamp255(Math.floor(24 + 60 * depth));
      add(Math.cos(ang) * r + rand(-0.09, 0.09), y, Math.sin(ang) * r + rand(-0.09, 0.09),
          clamp255(fr * (1 - gt) + 255 * gt),
          clamp255(fg * (1 - gt) + 202 * gt),
          clamp255(fb * (1 - gt) + 58 * gt),
          randInt(84, 110), false);
    }
  }

  // 地面光环：绿金交替
  var rings = [4.6, 6.0, 7.4, 8.8, 10.2, 11.4];
  for (i = 0; i < GROUND_N; i++) {
    var idx = Math.floor(Math.random() * rings.length);
    r = gauss(rings[idx], 0.32);
    ang = Math.random() * TAU;
    if (idx & 1) {
      add(Math.cos(ang) * r, -0.25, Math.sin(ang) * r, 255, randInt(200, 240), randInt(92, 148), 110, Math.random() < 0.07);
    } else {
      add(Math.cos(ang) * r, -0.25, Math.sin(ang) * r, randInt(42, 112), randInt(226, 255), randInt(78, 138), 110, false);
    }
  }

  // 空中星点
  for (i = 0; i < STAR_N; i++) {
    var px0 = rand(-20, 20), py0 = rand(2.5, 19), pz0 = rand(-20, 20);
    if (Math.random() < 0.22) {
      add(px0, py0, pz0, randInt(50, 130), randInt(222, 255), randInt(80, 150), randInt(78, 100), Math.random() < 0.07);
    } else {
      add(px0, py0, pz0, 255, randInt(228, 255), randInt(168, 222), randInt(72, 104), Math.random() < 0.09);
    }
  }

  // 树顶 3D 爱心（金黄色，始终面向镜头）
  var hx, hy, f, topY = TREE_H + 0.05, dist, fq;
  heartStart = X.length;
  for (i = 0; i < HEART_N; i++) {
    do {
      hx = rand(-1.3, 1.3); hy = rand(-1.4, 1.4);
      f = Math.pow(hx * hx + hy * hy - 1, 3) - hx * hx * hy * hy * hy;
    } while (f > 0);
    dist = Math.hypot(hx, hy);
    fq = Math.max(0.35, 1.15 - 0.5 * dist);
    add(hx * 1.02, topY + (hy + 1) * 0.6, rand(-0.34, 0.34),
        255, clamp255(112 * fq + 148), clamp255(96 * fq + 18), randInt(108, 136), Math.random() < 0.012);
  }

  // 爱心周围的金色星环 + 光尘
  var HR_N = small ? 430 : 1000, ha, hr, hxx, hyy, hzz, pick;
  for (i = 0; i < HR_N; i++) {
    ha = Math.random() * TAU;
    if (Math.random() < 0.62) hr = rand(1.55, 2.85) + gauss(0, 0.12);   // 星环
    else hr = rand(0.9, 3.35);                                          // 光尘
    hxx = Math.cos(ha) * hr;
    hyy = topY + 0.62 + Math.sin(ha) * hr * 0.62 + rand(-0.14, 0.14);
    hzz = gauss(0, 0.14);
    pick = Math.random();
    if (pick < 0.10) {                                                   // 少量亮金点缀
      add(hxx, hyy, hzz, 255, randInt(206, 244), randInt(90, 150), randInt(84, 106), Math.random() < 0.05);
    } else if (pick < 0.46) {                                            // 暖白
      add(hxx, hyy, hzz, 255, randInt(236, 255), randInt(206, 236), randInt(80, 102), Math.random() < 0.03);
    } else {                                                             // 金
      add(hxx, hyy, hzz, 255, randInt(186, 226), randInt(70, 132), randInt(82, 108), Math.random() < 0.045);
    }
  }

  // 绕着爱心转的光点参数
  for (i = 0; i < ORB_N; i++) {
    orbA[i] = rand(0, TAU);
    orbS[i] = rand(0.25, 0.62) * (Math.random() < 0.5 ? 1 : -1);
    orbR[i] = rand(2.3, 3.7);
    orbP[i] = rand(0, TAU);
  }
  heartEnd = X.length;

  // 两侧光帘：树左右各一片竖向帘幕，底部绿、顶部金
  // 竖屏手机两边没有空间，光帘会跑到屏幕外，就不生成（改为更密的树身）
  var wingN = (W / H >= 1.05) ? WING_N : 0;
  wingStart = X.length;
  for (i = 0; i < wingN; i++) {
    var side = (i & 1) ? 1 : -1;
    u = Math.random();
    var yy = 0.4 + Math.pow(u, 1.12) * 13.8;
    var wv = Math.sin(u * TAU * 1.6 + side * 1.15);
    // 半径随高度收窄，抵消透视放大，屏幕上是两根近乎竖直的光帘
    var xw = side * (8.8 - 3.1 * u + 1.5 * wv) + gauss(0, 0.5);
    var zw = gauss(0, 1.15);
    var hi = u;
    if (Math.random() < 0.28 + 0.34 * hi) {
      add(xw, yy, zw, 255, randInt(200, 246), randInt(76, 150), randInt(62, 80), Math.random() < 0.045);
    } else {
      add(xw, yy, zw, randInt(18, 90), clamp255(Math.floor(176 + 70 * hi)), randInt(66, 138), randInt(60, 78), false);
    }
  }
  wingEnd = X.length;

  // 高空十字星芒
  for (i = 0; i < SPK_N; i++) {
    var sa0 = Math.random() * TAU, sr0 = rand(9.5, 17.5);
    spkX[i] = Math.cos(sa0) * sr0;
    spkY[i] = rand(7.0, 18.0);
    spkZ[i] = Math.sin(sa0) * sr0;
    spkP[i] = rand(0, TAU);
    spkV[i] = rand(0.6, 1.5);
  }

  N = X.length;
  xs = Float32Array.from(X); ys = Float32Array.from(Y); zs = Float32Array.from(Z);
  cr = Uint8Array.from(R); cg = Uint8Array.from(G); cb = Uint8Array.from(B);
  ph = Uint8Array.from(P); twk = Uint8Array.from(K); fac = Uint8Array.from(F); gl = Uint8Array.from(L);

  // 散落形态：每个粒子的目标位置（球壳内随机分布）
  TX = new Float32Array(N); TY = new Float32Array(N); TZ = new Float32Array(N);
  for (i = 0; i < N; i++) {
    var rr = 6 + Math.random() * 9.5;
    var th = Math.random() * TAU;
    var cph = rand(-1, 1), sph = Math.sqrt(1 - cph * cph);
    TX[i] = sph * Math.cos(th) * rr;
    TY[i] = 4.4 + cph * rr * 0.66;
    TZ[i] = sph * Math.sin(th) * rr;
  }
}

// 闪烁查表：256 项，避免逐粒子三角函数
var T = 0, angle = 0, last = 0;
function updateTwinkle(t) {
  var i, a;
  for (i = 0; i < 256; i++) {
    a = i * TAU / 256;
    TW_A[i] = 0.56 + 0.44 * (0.5 + 0.5 * Math.sin(a * 3 + t * 2.35));
    TW_B[i] = 0.38 + 0.62 * (0.5 + 0.5 * Math.sin(a * 7 - t * 4.20));
  }
}

// 加法混合柔光点（雪 / 余烬 / 流星 / 星芒 / 树顶光晕共用）
function addSoftDot(cx, cy, rad, r, g, b, alpha, bf, ww, hh) {
  if (rad < 0.6 || alpha <= 0.004) return;
  var r2 = rad * rad, inv = 1 / r2;
  var bx = (cx - rad) | 0, by = (cy - rad) | 0;
  var xe = bx + (rad | 0) * 2, ye = by + (rad | 0) * 2;
  if (bx < 0) bx = 0; if (by < 0) by = 0;
  if (xe > ww) xe = ww; if (ye > hh) ye = hh;
  if (bx >= xe || by >= ye) return;
  var px, py, dx, dy, d2, t2, m, p2, row, id2, ar, ag, ab, nr, ng, nb;
  for (py = by; py < ye; py++) {
    row = py * ww;
    dy = py - cy;
    var dy2 = dy * dy;
    for (px = bx; px < xe; px++) {
      dx = px - cx;
      d2 = dx * dx + dy2;
      if (d2 > r2) continue;
      t2 = 1 - d2 * inv;
      t2 = t2 * t2 * t2;
      m = t2 * alpha;
      id2 = row + px;
      p2 = bf[id2];
      ar = (p2 & 255) + r * m;
      ag = ((p2 >> 8) & 255) + g * m;
      ab = ((p2 >> 16) & 255) + b * m;
      nr = ar > 255 ? 255 : ar | 0;
      ng = ag > 255 ? 255 : ag | 0;
      nb = ab > 255 ? 255 : ab | 0;
      bf[id2] = 0xff000000 | (nb << 16) | (ng << 8) | nr;
    }
  }
}

// 雪
var snowX = new Float32Array(SNOW_N), snowY = new Float32Array(SNOW_N),
    snowR = new Float32Array(SNOW_N), snowV = new Float32Array(SNOW_N),
    snowP = new Float32Array(SNOW_N), snowS = new Float32Array(SNOW_N);
function respawnSnow(i, initial) {
  snowX[i] = rand(0, W);
  snowY[i] = initial ? rand(-40, H) : rand(-140, -20);
  snowR[i] = rand(10, 20);
  snowV[i] = rand(34, 62);
  snowP[i] = rand(0, TAU);
  snowS[i] = rand(8, 20);
}
function initSnow() { for (var i = 0; i < SNOW_N; i++) respawnSnow(i, true); }

// 金色余烬：沿树身上飘
var emX = new Float32Array(EMB_N), emY = new Float32Array(EMB_N), emZ = new Float32Array(EMB_N),
    emV = new Float32Array(EMB_N), emL = new Float32Array(EMB_N), emM = new Float32Array(EMB_N),
    emS = new Float32Array(EMB_N);
function respawnEmber(i) {
  var h = Math.pow(Math.random(), 1.15);
  var br = Math.pow(1 - h, 1.1) * 4.0 + rand(0, 0.6);
  var a = Math.random() * TAU;
  emX[i] = Math.cos(a) * br; emY[i] = 0.4 + TREE_H * h; emZ[i] = Math.sin(a) * br;
  emV[i] = rand(0.45, 1.7);
  emM[i] = rand(1.8, 4.4); emL[i] = emM[i] * rand(0.2, 1);
  emS[i] = rand(1.7, 3.4);
}
function initEmbers() { for (var i = 0; i < EMB_N; i++) respawnEmber(i); }

// 流星
var shots = [];
function spawnShot() {
  var dir = Math.random() < 0.5 ? 1 : -1;
  shots.push({
    x: dir > 0 ? rand(-40, W * 0.45) : rand(W * 0.55, W + 40),
    y: rand(-20, H * 0.42),
    vx: dir * rand(320, 560), vy: rand(90, 190),
    t: 0, life: rand(0.65, 1.15)
  });
}

function resize() {
  W = cvs.width = Math.max(1, cvs.clientWidth | 0);
  H = cvs.height = Math.max(1, cvs.clientHeight | 0);
  img = ctx.createImageData(W, H);
  buf = new Uint32Array(img.data.buffer);
}
window.addEventListener('resize', function () { resize(); initSnow(); });

// 拖动旋转
var dragX = null;
cvs.addEventListener('pointerdown', function (e) { dragX = e.clientX; cvs.setPointerCapture(e.pointerId); });
cvs.addEventListener('pointermove', function (e) {
  if (dragX === null) return;
  angle += (e.clientX - dragX) * 0.006;
  dragX = e.clientX;
});
cvs.addEventListener('pointerup', function () { dragX = null; });
cvs.addEventListener('pointercancel', function () { dragX = null; });
cvs.addEventListener('dblclick', function () { spawnShot(); spawnShot(); spawnShot(); });

function frame(now) {
  // 局部变量：避免闭包 / 全局查找拖慢热循环
  var bf = buf, ww = W, hh = H, NN = N;
  var X = xs, Y = ys, Z = zs, CR = cr, CG = cg, CB = cb, PH = ph, TWK = twk, FAC = fac, GL = gl;
  var wi0 = wingStart, hi0 = heartStart, hi1 = heartEnd;
  var TXa = TX, TYa = TY, TZa = TZ;
  var ta = TW_A, tb = TW_B;

  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
  last = now;
  T += dt;
  updateTwinkle(T);

  // 手势控制：看到手的时候，手的左右/上下带着树转；没手时自动缓慢自转
  var handOn = GS.active && (T - GS.lastSeen) < 0.6;
  if (handOn) {
    if (!GS.baseSet) { GS.base = angle - (GS.tx - 0.5) * 2.6; GS.baseSet = true; }
    var tgtA = GS.base + (GS.tx - 0.5) * 2.6;
    angle += (tgtA - angle) * Math.min(1, dt * 4.0);
    pitchExtra += (((0.5 - GS.ty) * 0.7) - pitchExtra) * Math.min(1, dt * 3.0);
  } else {
    GS.baseSet = false;
    angle += 0.26 * dt;
    pitchExtra += (0 - pitchExtra) * Math.min(1, dt * 2.0);
  }

  // 形态过渡：TREE → SCATTER(散落) / FOCUS(推近聚焦爱心)
  var wantMorph = GS.mode === 'SCATTER' ? 1 : 0;
  morph += (wantMorph - morph) * Math.min(1, dt * 3.0);
  var wantFocus = GS.mode === 'FOCUS' ? 1 : 0;
  focus += (wantFocus - focus) * Math.min(1, dt * 2.4);
  var setAngle = T * 0.22 * morph;                       // 散落时整团缓慢自旋
  var setC = Math.cos(setAngle), setS = Math.sin(setAngle);

  var ca = Math.cos(angle), sa = Math.sin(angle);
  var pitch = PITCH + Math.sin(T * 0.45) * 0.028 + pitchExtra;
  var cp = Math.cos(pitch), sp = Math.sin(pitch);
  var aspect = ww / hh;
  var fit = aspect < 1.05 ? 1 + (1.05 - aspect) * 0.52 : 1;   // 竖屏拉远，避免出框
  var camD = CAM_DIST * fit / (1 + focus * 0.55);             // 聚焦时推近
  var F0 = hh * 0.63;
  var ox = ww * 0.5, oy = hh * 0.5;
  // 聚焦时把树顶爱心平移到画面中心
  var shift = 0;
  if (focus > 0.002) {
    var hyc2 = TREE_H + 0.67;
    var ypc2 = hyc2 * cp - CAM_HEIGHT;
    var zpc2 = hyc2 * sp + camD;
    if (zpc2 > 0.4) shift = focus * ((oy - ypc2 * (F0 / zpc2)) - oy);
  }
  var i, x, y, z, xz, zz, yp, zp, sx, sy, size, bx, by, xe, ye, px, py, row, id2, p2, mx;
  var nr, ng2, nb, ci, cj, ck, k2, tw, f2, sz2;

  bf.fill(0xff000000);

  // 0. 树身后的绿金光雾，让黑色背景有层次
  addSoftDot(ox, oy + hh * 0.04, hh * 0.26, 22, 86, 40, 0.085, bf, ww, hh);
  addSoftDot(ox, oy - hh * 0.22, hh * 0.15, 46, 72, 26, 0.07, bf, ww, hh);

  // 1. 主体粒子：最大混合 + 闪烁；金色灯泡额外柔光
  for (i = 0; i < NN; i++) {
    if (morph > 0.002) {                             // 向散落形态插值
      x = X[i] + (TXa[i] - X[i]) * morph;
      y = Y[i] + (TYa[i] - Y[i]) * morph;
      z = Z[i] + (TZa[i] - Z[i]) * morph;
      mx = x * setC - z * setS;
      z = x * setS + z * setC;
      x = mx;
    } else {
      x = X[i]; y = Y[i]; z = Z[i];
    }
    if (i >= wi0 || (i >= hi0 && i < hi1)) {   // 光帘 + 爱心：固定在相机平面
      xz = x; zz = z;
    } else {
      xz = x * ca - z * sa;
      zz = x * sa + z * ca;
    }
    yp = y * cp - zz * sp - CAM_HEIGHT;
    zp = y * sp + zz * cp + camD;
    if (zp < 0.1) continue;
    k2 = F0 / zp;
    sx = (ox + xz * k2) | 0;
    sy = ((oy - yp * k2) - shift) | 0;
    if (sx < 0 || sx >= ww || sy < 0 || sy >= hh) continue;

    tw = TWK[i] ? tb[PH[i]] : ta[PH[i]];
    ci = (CR[i] * tw) | 0; cj = (CG[i] * tw) | 0; ck = (CB[i] * tw) | 0;

    f2 = FAC[i] * 0.01;
    sz2 = (2.7 - zp * 0.095) * f2;
    size = sz2 < 1 ? 1 : (sz2 | 0);

    if (GL[i]) {
      addSoftDot(sx, sy, size + 2.6, ci, cj, ck, 0.55 + 0.45 * tw, bf, ww, hh);
      continue;
    }

    bx = sx - size; by = sy - size; xe = bx + size + size; ye = by + size + size;
    if (bx < 0) bx = 0; if (by < 0) by = 0;
    if (xe > ww) xe = ww; if (ye > hh) ye = hh;
    for (py = by; py < ye; py++) {
      row = py * ww;
      for (px = bx; px < xe; px++) {
        id2 = row + px;
        p2 = bf[id2];
        nr = p2 & 255; if (ci > nr) nr = ci;
        ng2 = (p2 >> 8) & 255; if (cj > ng2) ng2 = cj;
        nb = (p2 >> 16) & 255; if (ck > nb) nb = ck;
        bf[id2] = 0xff000000 | (nb << 16) | (ng2 << 8) | nr;
      }
    }
  }

  // 2. 树顶爱心光晕（粉色）
  var hyc = TREE_H + 0.67;
  var hy0 = TREE_H + 0.92;
  var yp2 = hy0 * cp - CAM_HEIGHT;
  var zp2 = hy0 * sp + camD;
  if (zp2 > 0.2) {
    var k3 = F0 / zp2;
    var k4c = F0 / (hyc * sp + camD > 0.2 ? hyc * sp + camD : 0.2);
    var pyc = oy - (hyc * cp - CAM_HEIGHT) * k4c - shift;
    addSoftDot(ox, pyc, 3.8 * k4c, 255, 176, 92, 0.07 + 0.04 * Math.sin(T * 1.4), bf, ww, hh);
    addSoftDot(ox, oy - yp2 * k3 - shift, 2.2 * k3, 255, 196, 110, 0.16 + 0.10 * Math.sin(T * 1.9), bf, ww, hh);
  }

  // 2.5 绕爱心旋转的粉色光点
  for (i = 0; i < ORB_N; i++) {
    var oa = orbA[i] + T * orbS[i];
    var orx = Math.cos(oa) * orbR[i];
    var ory = hyc + Math.sin(oa) * orbR[i] * 0.62;
    yp = ory * cp - CAM_HEIGHT;
    zp = ory * sp + camD;
    if (zp < 0.3) continue;
    k2 = F0 / zp;
    sx = ox + orx * k2; sy = oy - yp * k2 - shift;
    var otw = 0.5 + 0.5 * Math.sin(T * 2.3 + orbP[i]);
    addSoftDot(sx, sy, 2.0 + 1.5 * otw, 255, 224, 150, 0.22 + 0.52 * otw, bf, ww, hh);
  }

  // 3. 金色余烬
  for (i = 0; i < EMB_N; i++) {
    emY[i] += emV[i] * dt;
    emL[i] -= dt;
    var life = emL[i] / emM[i];
    if (life <= 0 || emY[i] > TREE_H + 7) { respawnEmber(i); life = 0.3; }
    xz = emX[i] * ca - emZ[i] * sa;
    zz = emX[i] * sa + emZ[i] * ca;
    yp = emY[i] * cp - zz * sp - CAM_HEIGHT;
    zp = emY[i] * sp + zz * cp + camD;
    if (zp < 0.2) continue;
    k2 = F0 / zp;
    sx = ox + xz * k2; sy = oy - yp * k2 - shift;
    if (sx < -30 || sx > ww + 30 || sy < -30 || sy > hh + 30) continue;
    addSoftDot(sx, sy, emS[i] * (0.55 + 0.9 * (1 - life)) * (13 / zp),
               255, 208, 96, Math.min(1, life) * 0.8, bf, ww, hh);
  }

  // 4. 前景雪花
  for (i = 0; i < SNOW_N; i++) {
    snowY[i] += snowV[i] * dt;
    if (snowY[i] > hh + 40) respawnSnow(i, false);
    var swx = snowX[i] + Math.sin(T * 0.8 + snowP[i]) * snowS[i];
    var fade = snowY[i] > hh * 0.72 ? (1 - (snowY[i] - hh * 0.72) / (hh * 0.28)) : 1;
    if (fade < 0) fade = 0;
    addSoftDot(swx, snowY[i], snowR[i], 255, 255, 255, 0.5 * fade, bf, ww, hh);
  }

  // 5. 十字星芒
  for (i = 0; i < SPK_N; i++) {
    xz = spkX[i] * ca - spkZ[i] * sa;
    zz = spkX[i] * sa + spkZ[i] * ca;
    yp = spkY[i] * cp - zz * sp - CAM_HEIGHT;
    zp = spkY[i] * sp + zz * cp + camD;
    if (zp < 0.5) continue;
    k2 = F0 / zp;
    sx = ox + xz * k2; sy = oy - yp * k2 - shift;
    if (sx < -20 || sx > ww + 20 || sy < -20 || sy > hh + 20) continue;
    var sww = 0.5 + 0.5 * Math.sin(T * spkV[i] + spkP[i]);
    var aal2 = 0.12 + 0.62 * sww * sww;
    var ln = (5.5 + 5.5 * sww) * (13 / zp);
    for (var kk = 0; kk < 6; kk++) {
      var dd = kk * ln * 0.34;
      var af2 = aal2 * (1 - kk / 6);
      addSoftDot(sx + dd, sy, 1.5, 255, 244, 186, af2, bf, ww, hh);
      addSoftDot(sx - dd, sy, 1.5, 255, 244, 186, af2, bf, ww, hh);
      addSoftDot(sx, sy + dd, 1.5, 255, 244, 186, af2, bf, ww, hh);
      addSoftDot(sx, sy - dd, 1.5, 255, 244, 186, af2, bf, ww, hh);
    }
  }

  // 6. 地面光环：贴着树根流动的椭圆光晕
  var ypB = -0.25 * cp - CAM_HEIGHT;
  var zpB = -0.25 * sp + camD;
  if (zpB > 0.5) {
    var k2b = F0 / zpB;
    var bcx = ox, bcy = oy - ypB * k2b - shift;
    var rxB = 6.9 * k2b, ryB = rxB * 0.30;
    var aB, alB, goldB, flow;
    for (aB = 0; aB < TAU; aB += TAU / 84) {
      flow = 0.5 + 0.5 * Math.sin(aB * 3 - T * 2.1);
      alB = 0.10 + 0.20 * flow;
      goldB = ((aB * 3.1) | 0) & 1;
      addSoftDot(bcx + Math.cos(aB) * rxB, bcy + Math.sin(aB) * ryB, 1.7 + 1.2 * flow,
                 goldB ? 255 : 90, goldB ? 208 : 255, goldB ? 96 : 150, alB, bf, ww, hh);
      alB *= 0.55;
      addSoftDot(bcx + Math.cos(aB) * rxB * 0.76, bcy + Math.sin(aB) * ryB * 0.76, 1.4 + 0.9 * flow,
                 goldB ? 255 : 80, goldB ? 214 : 255, goldB ? 110 : 150, alB, bf, ww, hh);
    }
  }

  // 7. 流星
  if (Math.random() < dt * 0.3) spawnShot();
  for (i = shots.length - 1; i >= 0; i--) {
    var s = shots[i];
    s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.t > s.life || s.x < -140 || s.x > ww + 140 || s.y > hh + 140) { shots.splice(i, 1); continue; }
    var k4, ppx, ppy, rrad, aal, fadeL = 1 - s.t / s.life;
    for (k4 = 0; k4 < 15; k4++) {
      ppx = s.x - s.vx * 0.011 * k4;
      ppy = s.y - s.vy * 0.011 * k4;
      rrad = 2.4 - k4 * 0.11;
      aal = (1 - k4 / 15) * fadeL * 0.8;
      addSoftDot(ppx, ppy, rrad < 0.7 ? 0.7 : rrad, 255, 236, 150, aal, bf, ww, hh);
    }
  }

  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}

// ══════════════════════════════════════════════════════════════
//  手势识别（MediaPipe Tasks Vision / HandLandmarker, GPU）
//  · 捏合(pinch)      → FOCUS   推近聚焦树顶爱心
//  · 握拳(fist)       → TREE    恢复圣诞树
//  · 张开(open hand)  → SCATTER 粒子散开成球
//  · 手掌中心(9号点) 左右/上下 → 带动整棵树旋转
//  慢加载：不点按钮不下载模型、不开摄像头，页面初始速度完全不变
// ══════════════════════════════════════════════════════════════
var VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm';
var WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm';
var MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

var handLandmarker = null, camVideo = null, camStream = null;
var lastDetect = 0, lastGestureAt = -99, camBusy = false;

function setStat(txt) {
  try { var el = document.getElementById('stat'); if (el) el.textContent = txt; } catch (e) {}
}
function setMode(m, from) {
  if (GS.mode === m) return;
  GS.mode = m;
  var names = { TREE: '圣诞树', SCATTER: '散落', FOCUS: '聚焦爱心' };
  setStat('手势：' + (from ? from + ' · ' : '') + (names[m] || m));
}

// 按规格：食指(8)/中指(12)/无名指(16)/小指(20) 到手腕(0) 的平均距离，
// 以及拇指(4)与食指(8)的间距来判断手势
function classifyHand(lm) {
  var w = lm[0];
  function d(p) { var dx = p.x - w.x, dy = p.y - w.y; return Math.sqrt(dx * dx + dy * dy); }
  var pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
  var avg = (d(lm[8]) + d(lm[12]) + d(lm[16]) + d(lm[20])) / 4;
  if (pinch < 0.055) return 'pinch';
  if (avg < 0.25) return 'fist';
  if (avg > 0.40) return 'open';
  return 'none';
}

function onLandmarks(lm) {
  GS.active = true;
  GS.lastSeen = T;
  var c = lm[9] || lm[0];
  GS.tx = c.x;
  GS.ty = c.y;
  var g = classifyHand(lm);
  if (g !== 'none' && g !== GS.gesture && (T - lastGestureAt) > 0.55) {
    lastGestureAt = T;
    GS.gesture = g;
    if (g === 'pinch') setMode('FOCUS', '捏合');
    else if (g === 'fist') setMode('TREE', '握拳');
    else if (g === 'open') setMode('SCATTER', '张开');
  }
  if (g === 'none') GS.gesture = 'none';
}

function detectLoop() {
  requestAnimationFrame(detectLoop);
  if (!handLandmarker || !camVideo || camVideo.readyState < 2) return;
  var now = performance.now();
  if (now - lastDetect < 55) return;          // ≈18fps 推理，够用又省电
  lastDetect = now;
  try {
    var res = handLandmarker.detectForVideo(camVideo, now);
    if (res && res.landmarks && res.landmarks.length) onLandmarks(res.landmarks[0]);
    else GS.active = false;
  } catch (e) { /* 单帧失败忽略 */ }
}

async function startHands() {
  if (camBusy || handLandmarker) return;
  camBusy = true;
  setStat('手势：加载模型…');
  try {
    var mod = await import(VISION_URL);
    var fileset = await mod.FilesetResolver.forVisionTasks(WASM_URL);
    handLandmarker = await mod.HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
      runningMode: 'VIDEO',
      numHands: 1
    });
    setStat('手势：请允许摄像头…');
    camVideo = document.getElementById('cam');
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' }, audio: false
    });
    camVideo.srcObject = camStream;
    await camVideo.play();
    GS.ready = true;
    setStat('手势：已就绪 · 把手举到镜头前');
    detectLoop();
  } catch (e) {
    camBusy = false;
    var msg = (e && e.message) ? String(e.message) : '未知错误';
    setStat('手势：启用失败（' + msg.slice(0, 42) + '）');
  }
}

function initUI() {
  try {
    var btn = document.getElementById('camBtn');
    var ui = document.getElementById('ui');
    if (btn) {
      btn.addEventListener('click', function () {
        if (GS.ready) { setStat('手势：已启用'); return; }
        btn.textContent = '正在启用…';
        startHands().then(function () {
          btn.textContent = GS.ready ? '手势已启用' : '重试启用摄像头';
        });
      });
    }
    document.addEventListener('keydown', function (e) {
      var k = e.key;
      if (k === 'h' || k === 'H') { if (ui) ui.classList.toggle('ui-hidden'); }
      else if (k === '1' || k === '2' || k === '3') {
        setMode(k === '1' ? 'TREE' : (k === '2' ? 'SCATTER' : 'FOCUS'), '按键');
      }
    });
  } catch (e) { /* 无 UI 环境（测试）时忽略 */ }
}

initUI();
resize();
initSnow();
initEmbers();
build();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
